<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 378" width="960" height="378" role="img" aria-labelledby="t d">
  <title id="t">Graph classification on MUTAG with a GCN</title>
  <desc id="d">MUTAG molecules are split at random into 150 training and 38 test graphs and batched 64 at a time by Dataloader into one disjoint graph with batch_indices. The GCN applies three GCNConv layers, averages node embeddings per graph with global_mean_pool, then Dropout and a Linear layer give two class logits. Training uses cross-entropy, value_and_grad and Adam for 30 epochs; train and test accuracy are measured after every epoch.</desc>
  <style>
    text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1f1f1e; }
    .hdr { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #6b6a64; }
    .title { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 600; }
    .stitle { font-size: 12px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #52514e; }
    .msub { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #52514e; }
    .small { font-size: 11px; fill: #6b6a64; }
    .alab { font-size: 11px; fill: #52514e; }
    .malab { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11px; fill: #52514e; }
    .leg { font-size: 11.5px; fill: #52514e; }
    .chip { font-size: 11.5px; font-weight: 600; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#6b6a64"/></marker>
  </defs>
  <rect x="0.75" y="0.75" width="958.5" height="376.5" rx="14" fill="#fcfcfb" stroke="#dcdbd4" stroke-width="1.5"/>
  <rect x="24" y="52" width="176" height="280" rx="10" fill="#f2f1ed"/>
  <text class="hdr" x="26" y="40">DATA</text>
  <rect x="224" y="52" width="372" height="280" rx="10" fill="#f2f1ed"/>
  <text class="hdr" x="226" y="40">MODEL · GCN</text>
  <rect x="620" y="52" width="146" height="280" rx="10" fill="#f2f1ed"/>
  <text class="hdr" x="622" y="40">TRAIN</text>
  <rect x="790" y="52" width="146" height="280" rx="10" fill="#f2f1ed"/>
  <text class="hdr" x="792" y="40">EVALUATE</text>
  <!-- data column -->
  <rect x="34" y="62" width="156" height="72" rx="6" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="title" x="42" y="80.6">TUDataset</text>
  <text class="sub" x="42" y="95.6">MUTAG · 188 molecules</text>
  <text class="sub" x="42" y="110.1">~18 atoms · 7 atom types</text>
  <text class="sub" x="42" y="124.6">2 classes</text>
  <rect x="34" y="144" width="156" height="46" rx="6" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="stitle" x="42" y="160">random split</text>
  <rect x="42" y="167" width="110.1" height="7" rx="2" fill="#1baf7a" fill-opacity="1.0"/>
  <rect x="154.106" y="167" width="27.9" height="7" rx="2" fill="#1baf7a" fill-opacity="0.55"/>
  <text class="small" x="42" y="185">150 train</text>
  <text class="small" x="182" y="185" text-anchor="end">38 test</text>
  <rect x="34" y="200" width="156" height="122" rx="6" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="title" x="42" y="218">Dataloader</text>
  <text class="sub" x="42" y="234">64 graphs per batch</text>
