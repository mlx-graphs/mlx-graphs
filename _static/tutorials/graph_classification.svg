  <text class="title" x="478" y="127.3">edge_index</text>
  <path d="M470,123 L458,123" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M458,77.0 L458,169.0" stroke="#6b6a64" stroke-width="1.5" fill="none"/>
  <path d="M458,77 L447,77" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M458,123 L447,123" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M458,169 L447,169" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <rect x="470" y="200" width="116" height="30" rx="6" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="title" x="478" y="219.3">batch_indices</text>
  <path d="M470,215 L447,215" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M446,307 L629,307" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <text class="alab" x="470" y="300" text-anchor="start" stroke="#f2f1ed" stroke-width="4" paint-order="stroke" stroke-linejoin="round">graphs × 2 logits</text>
  <!-- train column: loss, gradients, Adam update -->
  <rect x="630" y="62" width="126" height="72" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="title" x="638" y="80.6">Adam</text>
  <text class="sub" x="638" y="95.6">lr 0.01</text>
  <text class="sub" x="638" y="110.1">30 epochs</text>
  <text class="msub" x="638" y="124.6">model.train()</text>
  <rect x="630" y="177" width="126" height="46" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="title" x="638" y="197.1">value_and_grad</text>
  <text class="sub" x="638" y="212.1">loss and gradients</text>
  <rect x="630" y="292" width="126" height="30" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="title" x="638" y="311.3">cross_entropy</text>
  <path d="M693,292 L693,224" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M693,177 L693,135" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
