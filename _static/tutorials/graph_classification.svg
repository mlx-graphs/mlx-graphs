  <line x1="92" y1="249" x2="94" y2="271" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="82" cy="260" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="92" cy="249" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="105" cy="252" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="109" cy="266" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="94" cy="271" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <text class="malab" x="95.5" y="288" text-anchor="middle">1</text>
  <line x1="152" y1="260" x2="162" y2="249" stroke="#1baf7a" stroke-width="1.2"/>
  <line x1="162" y1="249" x2="175" y2="252" stroke="#1baf7a" stroke-width="1.2"/>
  <line x1="175" y1="252" x2="179" y2="266" stroke="#1baf7a" stroke-width="1.2"/>
  <line x1="179" y1="266" x2="164" y2="271" stroke="#1baf7a" stroke-width="1.2"/>
  <line x1="164" y1="271" x2="152" y2="260" stroke="#1baf7a" stroke-width="1.2"/>
  <line x1="162" y1="249" x2="164" y2="271" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="152" cy="260" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="162" cy="249" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="175" cy="252" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="179" cy="266" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <circle cx="164" cy="271" r="2.6" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/>
  <text class="malab" x="165.5" y="288" text-anchor="middle">63</text>
  <text class="sub" x="133" y="263" text-anchor="middle">···</text>
  <text class="sub" x="42" y="314">one disjoint graph</text>
  <!-- model column: the GCN class of the notebook -->
  <rect x="234" y="62" width="212" height="30" rx="6" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
  <text class="title" x="242" y="81.5">GCNConv</text>
  <text class="sub" x="438" y="81.5" text-anchor="end">7 → 64 · ReLU</text>
  <rect x="234" y="108" width="212" height="30" rx="6" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
  <text class="title" x="242" y="127.5">GCNConv</text>
  <text class="sub" x="438" y="127.5" text-anchor="end">64 → 64 · ReLU</text>
  <rect x="234" y="154" width="212" height="30" rx="6" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
  <text class="title" x="242" y="173.5">GCNConv</text>
  <text class="sub" x="438" y="173.5" text-anchor="end">64 → 64</text>
  <rect x="234" y="200" width="212" height="30" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="title" x="242" y="219.5">global_mean_pool</text>
  <text class="sub" x="438" y="219.5" text-anchor="end">per graph</text>
  <rect x="234" y="246" width="212" height="30" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="title" x="242" y="265.5">Dropout</text>
  <text class="sub" x="438" y="265.5" text-anchor="end">p = 0.5</text>
  <rect x="234" y="292" width="212" height="30" rx="6" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
  <text class="title" x="242" y="311.5">Linear</text>
  <text class="sub" x="438" y="311.5" text-anchor="end">64 → 2</text>
  <path d="M340,92 L340,108" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M340,138 L340,154" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M340,184 L340,200" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <text class="alab" x="348" y="195.5">nodes × 64</text>
  <path d="M340,230 L340,246" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <text class="alab" x="348" y="241.5">graphs × 64</text>
  <path d="M340,276 L340,292" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
