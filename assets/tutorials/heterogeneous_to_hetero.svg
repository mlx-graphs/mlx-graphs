<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">Heterogeneous graphs with to_hetero on DBLP, mlx-graphs vs PyG</title>
  <desc id="d">DBLP has four node types (author, paper, term, conference) and six edge types, stored in a HeteroGraphData. to_hetero converts a homogeneous GraphSAGE or GAT into a ToHeteroModel with one copy of every layer per edge type; the messages that reach a node type are summed. The author logits are trained full batch with cross-entropy and AdamW on 400 authors, and test accuracy and time per epoch are compared with PyG&#x27;s to_hetero on the CPU. The notebook also covers to_hetero_with_bases, HeteroConv, HGTConv and HANConv, NeighborLoader and HGTLoader, and the ogbn-mag recipe.</desc>
