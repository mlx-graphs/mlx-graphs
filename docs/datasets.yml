# The "Available datasets" table of tutorials/guides/datasets.md. gen.py builds
# the table from this file and checks that every class exists and accepts the
# arguments. A new dataset needs one entry. The statistics come from
#   python examples/compute_dataset_stats.py --dataset <key>
# with the conventions of that script: avg_degree = 2 * edges / nodes;
# collections give the number of graphs and "~" averages per graph (over the
# split that "Load with" loads); heterogeneous graphs count the nodes and edges
# of all types; temporal graphs count each event as an edge.

