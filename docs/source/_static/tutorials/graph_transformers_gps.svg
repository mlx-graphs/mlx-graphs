<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="t d">
  <title id="t">GPS graph transformer on Peptides-func, mlx-graphs vs PyG</title>
  <desc id="d">Peptides-func graphs from LRGBDataset get random-walk structural encodings (AddRandomWalkPE) and are batched 32 at a time. The GPS model embeds atoms and bonds with FeatureEncoder and projects the encodings with RWSEEncoder. Each of its 4 GPSConv layers runs a local GINEConv along the bonds and a global MultiheadAttention within each graph in parallel, each with a residual connection and batch normalization, sums them and applies an MLP with a residual and a normalization. global_mean_pool and an MLP head give 10 logits, trained with binary cross-entropy, an L2 penalty and Adam with bias correction, evaluated with average precision and compared with PyG on the CPU. The notebook also covers LapPE on CSL, PerformerAttention, DenseLayout with mx.compile, and SGFormer and Polynormer on Cora.</desc>
