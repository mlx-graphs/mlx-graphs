<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">MetaPath2Vec on DBLP: meta-path random walks, skip-gram embeddings, author research areas</title>
  <desc id="d">DBLP is a heterogeneous graph of 4,057 authors, 14,328 papers, 7,723 terms and 20 conferences, with edges in both directions. MetaPath2Vec samples random walks that follow the meta-path author, paper, conference, paper, author (APCPA) with mlx_cluster.metapath_random_walk, 5 walks of 50 steps per author. pos_sample cuts the walks into windows of 7 nodes and neg_sample replaces every position but the first with a random node of the type the meta-path puts there, 5 negatives per positive. One Embedding table of 128 dimensions holds the authors, papers and conferences, the types on the meta-path. It is trained without labels with the skip-gram loss, value_and_grad and Adam for 5 epochs over batches of 128 authors. A Linear layer trained on the frozen, standardized author embeddings of the training split then predicts the research area of each author (4 classes), and its accuracy is measured on the test split. The notebook starts with a toy graph of 6 authors, 6 papers and 2 venues, with the APVPA meta-path, to show the walks, the windows, the negatives and the similarity of the learned author embeddings.</desc>
