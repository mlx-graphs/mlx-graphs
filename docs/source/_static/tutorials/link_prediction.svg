  <text class="leg" x="545.925" y="446">state or sampling, no weights</text>
  <rect x="715.207" y="437" width="10" height="10" rx="2.5" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="leg" x="731.207" y="446">no weights</text>
  <rect x="805.212" y="437" width="10" height="10" rx="2.5" fill="#e9f1fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text class="leg" x="821.212" y="446">mlx-graphs</text>
  <rect x="897.632" y="437" width="10" height="10" rx="2.5" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
  <text class="leg" x="913.632" y="446">PyG</text>
</svg>
