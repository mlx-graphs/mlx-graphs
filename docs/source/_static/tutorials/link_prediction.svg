  <text class="title" x="304" y="386.1">VGAE</text>
  <text class="sub" x="304" y="401.1">mean and log std · kl_loss</text>
  <rect x="558" y="366" width="368" height="46" rx="6" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="title" x="566" y="386.1">LinkNeighborLoader</text>
  <text class="sub" x="566" y="401.1">batches of 256 edges · 10, 10 neighbors</text>
