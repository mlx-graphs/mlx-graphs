  <text class="sub" x="638" y="110.1">20 epochs</text>
  <text class="sub" x="638" y="124.6">GPU</text>
  <rect x="630" y="146" width="126" height="46" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
