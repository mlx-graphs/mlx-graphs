  <text class="sub" x="638" y="254">LUMO energy</text>
  <rect x="630" y="292" width="126" height="30" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="title" x="638" y="311.3">mse_loss</text>
  <text class="sub" x="748" y="311.3" text-anchor="end">sum</text>
  <path d="M693,264 L693,291" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)" stroke-opacity="0"/>
  <path d="M762,307 L770,307 L770,169 L757,169" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M693,146 L693,135" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M693,264 L693,291" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <!-- evaluate column -->
  <path d="M770,98 L786,98" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <rect x="800" y="62" width="126" height="72" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="stitle" x="808" y="80.6">mean squared error</text>
  <text class="sub" x="808" y="95.6">train &amp; test sets</text>
  <text class="sub" x="808" y="110.1">per molecule</text>
  <text class="sub" x="808" y="124.6">after every epoch</text>
  <path d="M863,134 L863,176" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <rect x="800" y="177" width="126" height="46" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="stitle" x="808" y="197.1">loss curves</text>
  <text class="sub" x="808" y="212.1">matplotlib plot</text>
  <rect x="685.997" y="347" width="10" height="10" rx="2.5" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="leg" x="701.997" y="356">data</text>
  <rect x="742.767" y="347" width="10" height="10" rx="2.5" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
  <text class="leg" x="758.767" y="356">trainable weights</text>
  <rect x="863.995" y="347" width="10" height="10" rx="2.5" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="leg" x="879.995" y="356">no weights</text>
</svg>
