<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 460" width="1072" height="460" role="img" aria-labelledby="t d">
  <title id="t">G-reasoner: from a question and a knowledge graph to a score for every node</title>
  <desc id="d">Left: a small knowledge graph for the question "In which county is the town in which Raymond Robertsen was born?". Documents are rectangles and entities are pills. The start nodes of the question are filled. The entity raymond robertsen is linked to the entity hammerfest by the fact "born in", and hammerfest is mentioned in the document Hammerfest, which is not a start node. Middle: the G-reasoner model. A text embedding model reads the text of the nodes and the question. An MLP gives the question to the start nodes only. The edges go to six layers of relational message passing (one Metal kernel), each followed by a linear layer, a layer normalization and a ReLU with a residual connection. A last MLP gives the scores. Right: the same graph, where every node holds its score. The documents Raymond Robertsen (7.0) and Hammerfest (6.4) are far above every other node. An LLM reads the top 5 documents and answers Finnmark county.</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1a1a1a; }
    .b { font-weight: 600; }
    .i { font-style: italic; }
    .s { font-size: 11px; fill: #555555; }
    .rel { font-size: 11px; font-style: italic; fill: #555555; }
    .ent { font-size: 11.5px; }
    .num { font-size: 11px; font-weight: 600; }
    .box { stroke: #2b2b2b; stroke-width: 1.2; }
    .line { fill: none; stroke: #2b2b2b; stroke-width: 1.2; }
    .mention { fill: none; stroke: #8a8a8a; stroke-width: 1.1; stroke-dasharray: 3.5 3; }
    .edge { fill: none; stroke: #8a8a8a; stroke-width: 1.1; }
    .hop { fill: none; stroke: #1f4e9c; stroke-width: 2.4; }
    .panel { fill: none; stroke: #b8b8b8; stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2b2b2b"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#8a8a8a"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1f4e9c"/></marker>
  </defs>
  <rect width="1072" height="460" rx="8" fill="#ffffff"/>

  <!-- question -->
  <text x="16" y="30"><tspan class="b">Question</tspan><tspan class="i" dx="10">In which county is the town in which Raymond Robertsen was born?</tspan></text>

  <!-- input: the knowledge graph and the start nodes -->
  <rect class="panel" x="16" y="48" width="442" height="356" rx="4"/>
  <text class="s" x="28" y="67">Knowledge graph</text>
  <path class="mention" d="M92,206 L92,138" marker-end="url(#am)"/>
  <path class="mention" d="M240,206 L240,138" marker-end="url(#am)"/>
  <path class="mention" d="M372,206 L302,138" marker-end="url(#am)"/>
  <path class="line" d="M92,230 L92,290" marker-end="url(#a)"/>
  <text class="rel" x="99" y="264">is a town in</text>
  <path class="line" d="M240,230 L240,290" marker-end="url(#a)"/>
  <text class="rel" x="247" y="264">is a</text>
  <path class="line" d="M398,230 L398,290" marker-end="url(#a)"/>
  <text class="rel" x="391" y="264" text-anchor="end">is a municipality in</text>
  <path class="hop" d="M304,218 L352,218" marker-end="url(#ah)"/>
  <text x="328" y="209" text-anchor="middle" style="font-size:11px;font-style:italic;font-weight:600;fill:#1f4e9c">born in</text>
  <path class="hop" d="M398,206 L398,139" stroke-dasharray="6 3" marker-end="url(#ah)"/>

  <rect class="box" x="44" y="100" width="112" height="28" rx="3" fill="#fdeaa7"/>
  <rect class="box" x="40" y="104" width="112" height="28" rx="3" fill="#fdeaa7"/>
  <rect class="box" x="36" y="108" width="112" height="28" rx="3" fill="#fdeaa7"/>
  <text x="92" y="126.200" text-anchor="middle">Raymond, Maine</text>
  <text class="s" x="156" y="94" text-anchor="end">×4</text>
  <rect class="box" x="171" y="108" width="138" height="28" rx="3" fill="#fdeaa7"/>
  <text x="240" y="126.200" text-anchor="middle">Raymond Robertsen</text>
  <rect class="box" x="350" y="108" width="96" height="28" rx="3" fill="#ffffff"/>
  <text x="398" y="126.200" text-anchor="middle">Hammerfest</text>

  <rect class="box" x="57" y="206" width="70" height="24" rx="12" fill="#fdeaa7"/>
  <text class="ent" x="92" y="222" text-anchor="middle">raymond</text>
  <rect class="box" x="176" y="206" width="128" height="24" rx="12" fill="#fdeaa7"/>
  <text class="ent" x="240" y="222" text-anchor="middle">raymond robertsen</text>
  <rect class="box" x="354" y="206" width="88" height="24" rx="12" fill="#fdeaa7"/>
  <text class="ent" x="398" y="222" text-anchor="middle">hammerfest</text>
  <rect class="box" x="28" y="292" width="128" height="24" rx="12" fill="#fdeaa7"/>
  <text class="ent" x="92" y="308" text-anchor="middle">cumberland county</text>
  <rect class="box" x="172" y="292" width="136" height="24" rx="12" fill="#fdeaa7"/>
  <text class="ent" x="240" y="308" text-anchor="middle">norwegian politician</text>
  <rect class="box" x="362" y="292" width="72" height="24" rx="12" fill="#ffffff"/>
  <text class="ent" x="398" y="308" text-anchor="middle">finnmark</text>

  <rect class="box" x="28" y="352" width="20" height="13" rx="2" fill="#ffffff"/>
  <text class="s" x="54" y="363">document</text>
  <rect class="box" x="116" y="352" width="24" height="13" rx="6.500" fill="#ffffff"/>
  <text class="s" x="146" y="363">entity</text>
  <rect class="box" x="190" y="352" width="20" height="13" rx="2" fill="#fdeaa7"/>
  <text class="s" x="216" y="363">start node</text>
  <path class="line" d="M284,358.500 L308,358.500" marker-end="url(#a)"/>
  <text class="s" x="314" y="363">fact</text>
  <path class="mention" d="M348,358.500 L372,358.500" marker-end="url(#am)"/>
  <text class="s" x="378" y="363">mention</text>

  <!-- model -->
  <path class="line" d="M458,398 L553,398" marker-end="url(#a)"/>
  <text class="s" x="506" y="392" text-anchor="middle">text</text>
  <text x="636" y="440" text-anchor="middle">Question</text>
  <path class="line" d="M636,426 L636,411" marker-end="url(#a)"/>
  <rect class="box" x="554" y="386" width="164" height="24" rx="5" fill="#f9d5d3"/>
  <text x="636" y="402.200" text-anchor="middle">Text embedding</text>
  <path class="line" d="M636,386 L636,373" marker-end="url(#a)"/>
  <rect class="box" x="554" y="334" width="164" height="38" rx="5" fill="#d3e3f6"/>
  <text x="636" y="350.500" text-anchor="middle">MLP</text>
  <text class="s" x="636" y="364.500" text-anchor="middle">question on start nodes only</text>

  <rect x="536" y="160" width="200" height="158" rx="10" fill="#f3f3f3" stroke="#9a9a9a" stroke-width="1.2"/>
  <text x="526" y="238" text-anchor="end" style="font-size:14px">6×</text>
  <text class="s" x="526" y="254" text-anchor="end">mlx-graphs</text>
  <path class="line" d="M458,289 L553,289" marker-end="url(#a)"/>
  <text class="s" x="497" y="283" text-anchor="middle">edges</text>
  <path class="line" d="M636,334 L636,309" marker-end="url(#a)"/>
  <path class="line" d="M636,325 L730,325 L730,176 L645,176" marker-end="url(#a)"/>
  <rect class="box" x="554" y="270" width="164" height="38" rx="5" fill="#fbdcae"/>
  <text x="636" y="286.500" text-anchor="middle">Relational message passing</text>
  <text class="s" x="636" y="300.500" text-anchor="middle">one Metal kernel</text>
  <path class="line" d="M636,270 L636,259" marker-end="url(#a)"/>
  <rect class="box" x="554" y="234" width="164" height="24" rx="5" fill="#d3e3f6"/>
  <text x="636" y="250.200" text-anchor="middle">Linear</text>
  <path class="line" d="M636,234 L636,223" marker-end="url(#a)"/>
  <rect class="box" x="554" y="198" width="164" height="24" rx="5" fill="#d9ead3"/>
  <text x="636" y="214.200" text-anchor="middle">LayerNorm, ReLU</text>
  <path class="line" d="M636,198 L636,185" marker-end="url(#a)"/>
  <circle class="box" cx="636" cy="176" r="8" fill="#ffffff"/>
  <path class="line" d="M636,171.500 L636,180.500 M631.5,176 L640.5,176"/>
  <path class="line" d="M636,168 L636,145" marker-end="url(#a)"/>
  <rect class="box" x="554" y="120" width="164" height="24" rx="5" fill="#d3e3f6"/>
  <text x="636" y="136.200" text-anchor="middle">MLP</text>

  <!-- output: the same graph, one score per node -->
  <path class="line" d="M718,132 L755,132" marker-end="url(#a)"/>
  <rect class="panel" x="756" y="48" width="300" height="206" rx="4"/>
  <text class="s" x="768" y="67">Score of every node</text>
  <path class="edge" stroke-dasharray="3.5 3" d="M817.2,167.4 L817.2,124.0"/>
  <path class="edge" stroke-dasharray="3.5 3" d="M914.9,167.4 L914.9,124.0"/>
  <path class="edge" stroke-dasharray="3.5 3" d="M1003.2,167.4 L932.9,124.0"/>
  <path class="edge" d="M817.2,187.4 L817.2,224.1"/>
  <path class="edge" d="M914.9,187.4 L914.9,224.1"/>
  <path class="edge" d="M1019.2,187.4 L1019.2,224.1"/>
  <path class="hop" d="M940.9,177.4 L991.2,177.4" marker-end="url(#ah)"/>
  <path class="hop" stroke-dasharray="6 3" d="M1019.2,167.4 L1019.2,126.0" marker-end="url(#ah)"/>
  <rect class="box" x="797.2" y="98" width="52" height="20" rx="3" fill="#c5d2e7"/>
  <rect class="box" x="794.2" y="101" width="52" height="20" rx="3" fill="#b6c6e0"/>
  <rect class="box" x="791.2" y="104" width="52" height="20" rx="3" fill="#a8bbda"/>
  <text class="num" x="817.2" y="118" text-anchor="middle" fill="#1a1a1a" style="fill:#1a1a1a">−1.1</text>
  <rect class="box" x="888.9" y="104" width="52" height="20" rx="3" fill="#204f9d"/>
  <text class="num" x="914.9" y="118" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">7.0</text>
  <rect class="box" x="993.2" y="104" width="52" height="20" rx="3" fill="#2b58a1"/>
  <text class="num" x="1019.2" y="118" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">6.4</text>
  <rect class="box" x="791.2" y="167.4" width="52" height="20" rx="10" fill="#c4d2e7"/>
  <text class="num" x="817.2" y="181.4" text-anchor="middle" fill="#1a1a1a" style="fill:#1a1a1a">−2.8</text>
  <rect class="box" x="888.9" y="167.4" width="52" height="20" rx="10" fill="#94abd1"/>
  <text class="num" x="914.9" y="181.4" text-anchor="middle" fill="#1a1a1a" style="fill:#1a1a1a">0.1</text>
  <rect class="box" x="993.2" y="167.4" width="52" height="20" rx="10" fill="#d5dfee"/>
  <text class="num" x="1019.2" y="181.4" text-anchor="middle" fill="#1a1a1a" style="fill:#1a1a1a">−3.8</text>
  <rect class="box" x="791.2" y="224.1" width="52" height="20" rx="10" fill="#b4c5df"/>
  <text class="num" x="817.2" y="238.1" text-anchor="middle" fill="#1a1a1a" style="fill:#1a1a1a">−1.9</text>
  <rect class="box" x="888.9" y="224.1" width="52" height="20" rx="10" fill="#adbfdc"/>
  <text class="num" x="914.9" y="238.1" text-anchor="middle" fill="#1a1a1a" style="fill:#1a1a1a">−1.4</text>
  <rect class="box" x="993.2" y="224.1" width="52" height="20" rx="10" fill="#f0f4fa"/>
  <text class="num" x="1019.2" y="238.1" text-anchor="middle" fill="#1a1a1a" style="fill:#1a1a1a">−5.4</text>
  <text class="s" x="809.2" y="93.0" text-anchor="middle">Raymond, Maine</text>
  <text x="916.9" y="93.0" text-anchor="middle" style="font-size:11px">Raymond Robertsen</text>
  <text x="1019.2" y="93.0" text-anchor="middle" style="font-size:11px">Hammerfest</text>

  <!-- LLM and answer -->
  <path class="line" d="M906,254 L906,297" marker-end="url(#a)"/>
  <text class="s" x="914" y="280">the 5 best documents</text>
  <rect class="box" x="846" y="298" width="120" height="38" rx="5" fill="#e4d7f0"/>
  <text x="906" y="314.500" text-anchor="middle">LLM</text>
  <text class="s" x="906" y="328.500" text-anchor="middle">Gemma 4 12B</text>
  <path class="line" d="M906,336 L906,373" marker-end="url(#a)"/>
  <text class="b" x="906" y="393" text-anchor="middle" style="font-size:13px">Finnmark county</text>
</svg>
