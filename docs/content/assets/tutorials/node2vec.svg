<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 414" width="960" height="414" role="img" aria-labelledby="t d">
  <title id="t">Node2Vec on Cora: biased random walks, skip-gram training, mlx-graphs vs PyG</title>
  <desc id="d">Node2Vec samples biased random walks on the Cora citation graph: after a step from t to v, the next node is chosen with weight 1/p to go back, 1 to stay near t and 1/q to move away. Each walk of 20 nodes is cut into windows of 10 nodes; random windows serve as negatives. A 2,708 by 128 Embedding is trained with the skip-gram loss and Adam. The embeddings are evaluated by logistic-regression node classification and by link prediction. The notebook then compares walk biases, GPU and CPU walk sampling, and mlx-graphs on the GPU against PyG on the CPU.</desc>
