name: build-docs

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # tags: the Changelog page and the version on the home page
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
           python-version: "3.12"
      - name: Install the docs dependencies
        # only the docs tools (the docs extra): the API pages come from static
        # analysis, so mlx and torch are not needed
        run: |
          python -m pip install --upgrade pip
          python -m pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['docs']))")
      - name: Check that the API reference lists every public name
        run: python docs-site/scripts/check_api.py
      - name: Generate the API, notebook, changelog and benchmark pages
        env:
          # the Changelog page shows the notes of the GitHub releases
          GITHUB_TOKEN: ${{ github.token }}
        run: python docs-site/scripts/gen.py
      - name: Build the site (Zensical, strict)
        run: zensical build --strict --clean
      - name: Check whether this release has already deployed
        if: inputs.ref != ''
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          if draft=$(gh release view "${RELEASE_REF#refs/tags/}" \
            --json isDraft --jq .isDraft 2>/dev/null) && [[ "$draft" == false ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to GitHub Pages
        if: steps.release.outputs.complete != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
