name: build-sphinx-docs

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
           python-version: 3.11
      - name: Install Python dependencies
        run: python -m pip install .[docs]
      - name: Install Pandoc
        uses: pandoc/actions/setup@v1.0.0
        with:
          version: 2.19
      - name: Build sphinx
        run: |
          cd docs/
          make html
      - name: Check whether this release has already deployed
        if: inputs.ref != ''
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          if draft=$(gh release view "${RELEASE_REF#refs/tags/}" \
            --json isDraft --jq .isDraft 2>/dev/null) && [[ "$draft" == false ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to GitHub Pages
        if: steps.release.outputs.complete != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
