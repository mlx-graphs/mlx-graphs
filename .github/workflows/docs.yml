name: docs-pr

# Builds the Zensical documentation site (zensical.toml, docs/) on pull
# requests. Build only: publish_docs.yml builds and deploys the site at each
# release.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version shown on the home page
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the docs dependencies
        # only the docs tools: the API pages come from static analysis, so
        # mlx (macOS only) and torch are not needed
        run: |
          python -m pip install --upgrade pip
          python -m pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['docs']))")
      - name: Check that the API reference lists every public name
        # fails on a public class or function missing from docs/api/,
        # and on a listed name that no longer exists
        run: python docs/scripts/check_api.py
      - name: Generate the API, notebook, changelog and benchmark pages
        env:
          # the changelog shows the notes of the GitHub releases
          GITHUB_TOKEN: ${{ github.token }}
        run: python docs/scripts/gen.py
      - name: Build the site (strict)
        run: zensical build --strict --clean
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 7
