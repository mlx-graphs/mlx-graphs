<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Intrusion detection on DARPA CADETS with Orthrus and Velox</title>
  <desc id="d">The CADETS audit records are parsed into a provenance graph of processes, files and netflows, split by day into training, validation and test days, and repeated events are fused in 15-minute windows. Word2vec embeds the node names. Velox encodes each node with a linear layer and Orthrus with two TransformerConv layers over the 20 latest neighbors from LastNeighborLoader; a shared decoder predicts the type of every event. The cross-entropy of an event is its anomaly score, a node's score is the maximum over its test events, nodes above the highest validation score are alerts, and the alerts are compared with the ground truth of three attacks.</desc>
  <style>
    text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1f1f1e; }
    .hdr { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #6b6a64; }
    .title { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: 600; }
    .stitle { font-size: 12px; font-weight: 600; }
    .sub { font-size: 11.5px; fill: #52514e; }
    .msub { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #52514e; }
    .small { font-size: 11px; fill: #6b6a64; }
    .alab { font-size: 11px; fill: #52514e; }
    .leg { font-size: 11.5px; fill: #52514e; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#6b6a64"/></marker>
  </defs>
  <rect x="0.75" y="0.75" width="958.5" height="358.5" rx="14" fill="#fcfcfb" stroke="#dcdbd4" stroke-width="1.5"/>

  <rect x="24" y="52" width="176" height="262" rx="10" fill="#f2f1ed"/>
  <text class="hdr" x="26" y="40">PROVENANCE GRAPH</text>
  <rect x="224" y="52" width="160" height="262" rx="10" fill="#f2f1ed"/>
  <text class="hdr" x="226" y="40">NODE FEATURES</text>
  <rect x="408" y="52" width="296" height="262" rx="10" fill="#f2f1ed"/>
  <text class="hdr" x="410" y="40">MODELS · PREDICT EVENT TYPE</text>
  <rect x="728" y="52" width="208" height="262" rx="10" fill="#f2f1ed"/>
  <text class="hdr" x="730" y="40">DETECT</text>

  <!-- data column -->
  <rect x="34" y="62" width="156" height="60" rx="6" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="stitle" x="42" y="81">DARPA TC E3 · CADETS</text>
  <text class="sub" x="42" y="96">FreeBSD server, 12 days</text>
  <text class="sub" x="42" y="111">44M CDM18 JSON records</text>
  <path d="M112,122 L112,138" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="34" y="139" width="156" height="60" rx="6" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="stitle" x="42" y="158">process · file · netflow</text>
  <text class="sub" x="42" y="173">10 event types as edges</text>
  <text class="sub" x="42" y="188">fused in 15-min windows</text>
  <rect x="34" y="209" width="156" height="52" rx="6" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="stitle" x="42" y="226">split by day</text>
  <rect x="42" y="233" width="80" height="7" rx="2" fill="#1baf7a"/>
  <rect x="124" y="233" width="14" height="7" rx="2" fill="#1baf7a" fill-opacity="0.55"/>
  <rect x="140" y="233" width="42" height="7" rx="2" fill="#1baf7a" fill-opacity="0.3"/>
  <text class="small" x="42" y="253">train 7 · val 1</text>
  <text class="small" x="182" y="253" text-anchor="end">test 4</text>
  <rect x="34" y="271" width="156" height="33" rx="6" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="sub" x="42" y="292">643k nodes · 5.7M edges</text>

  <!-- features column -->
  <path d="M190,169 L233,169" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="234" y="62" width="140" height="74" rx="6" fill="#fdf3da" stroke="#eda100" stroke-width="1.5"/>
  <text class="stitle" x="242" y="81">node names</text>
  <text class="msub" x="242" y="96">/tmp/main</text>
  <text class="msub" x="242" y="111">nginx</text>
  <text class="msub" x="242" y="126">81.49.200.166:80</text>
  <path d="M304,136 L304,166" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ah)"/>
  <text class="alab" x="310" y="155" stroke="#f2f1ed" stroke-width="4" paint-order="stroke">tokens</text>
  <rect x="234" y="167" width="140" height="60" rx="6" fill="#fdf3da" stroke="#eda100" stroke-width="1.5"/>
  <text class="title" x="242" y="186">Word2Vec</text>
  <text class="sub" x="242" y="201">train days only</text>
  <text class="sub" x="242" y="216">256 dimensions</text>
  <rect x="234" y="237" width="140" height="46" rx="6" fill="#fdf3da" stroke="#eda100" stroke-width="1.5"/>
  <text class="stitle" x="242" y="256">+ node type</text>
  <text class="sub" x="242" y="271">one-hot, 259 total</text>

  <!-- models column -->
  <path d="M374,197 L396,197 L396,99 L417,99" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M396,197 L417,197" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="418" y="62" width="148" height="74" rx="6" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
  <text class="stitle" x="426" y="81">Velox</text>
  <text class="msub" x="426" y="96">Linear</text>
  <text class="sub" x="426" y="111">node features only,</text>
  <text class="sub" x="426" y="126">no message passing</text>
  <rect x="418" y="160" width="148" height="74" rx="6" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
  <text class="stitle" x="426" y="179">Orthrus</text>
  <text class="msub" x="426" y="194">TransformerConv</text>
  <text class="sub" x="426" y="209">8 heads, then 1</text>
  <text class="sub" x="426" y="224">edges: event type</text>
  <rect x="418" y="250" width="148" height="54" rx="6" fill="#fdf3da" stroke="#eda100" stroke-width="1.5"/>
  <text class="title" x="426" y="270">LastNeighborLoader</text>
  <text class="sub" x="426" y="286">20 latest neighbors</text>
  <path d="M492,250 L492,235" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M566,99 L578,99 L578,170 L589,170" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M566,197 L578,197 L578,170" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="590" y="130" width="104" height="80" rx="6" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
  <text class="stitle" x="598" y="149">decoder</text>
  <text class="sub" x="598" y="164">(src, dst) →</text>
  <text class="sub" x="598" y="179">type of the</text>
  <text class="sub" x="598" y="194">event, 10 classes</text>
  <text class="small" x="592" y="236">trained on benign</text>
  <text class="small" x="592" y="250">days, 12 epochs</text>

  <!-- detect column -->
  <path d="M694,170 L737,170" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="738" y="62" width="188" height="46" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="stitle" x="746" y="81">edge score</text>
  <text class="sub" x="746" y="96">cross-entropy of its type</text>
  <path d="M832,108 L832,124" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="738" y="125" width="188" height="46" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="stitle" x="746" y="144">node score</text>
  <text class="sub" x="746" y="159">max over its test edges</text>
  <path d="M832,171 L832,187" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="738" y="188" width="188" height="46" rx="6" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="stitle" x="746" y="207">alerts</text>
  <text class="sub" x="746" y="222">score &gt; max on Apr 10</text>
  <path d="M832,234 L832,250" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="738" y="251" width="188" height="53" rx="6" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
  <text class="stitle" x="746" y="270">vs ground truth</text>
  <text class="sub" x="746" y="286">3 Nginx backdoor attacks</text>
  <text class="sub" x="746" y="299">precision · MCC · ADP</text>

  <!-- legend -->
  <rect x="300" y="329" width="10" height="10" rx="2.5" fill="#e7f6f0" stroke="#1baf7a" stroke-width="1.5"/>
  <text class="leg" x="316" y="338">data</text>
  <rect x="358" y="329" width="10" height="10" rx="2.5" fill="#fdf3da" stroke="#eda100" stroke-width="1.5"/>
  <text class="leg" x="374" y="338">no gradient (features, sampling)</text>
  <rect x="566" y="329" width="10" height="10" rx="2.5" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
  <text class="leg" x="582" y="338">trainable weights</text>
  <rect x="694" y="329" width="10" height="10" rx="2.5" fill="#ffffff" stroke="#a9a89f" stroke-width="1.5"/>
  <text class="leg" x="710" y="338">scoring</text>
  <rect x="776" y="329" width="10" height="10" rx="2.5" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
  <text class="leg" x="792" y="338">evaluation</text>
</svg>
